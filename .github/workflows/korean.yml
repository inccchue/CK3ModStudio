name: Build CK3ModStudio Korean Complete

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace All UI Strings Without Syntax Errors
        shell: pwsh
        run: |
          # C# 변수명 에러 방지를 위해 공백 없는 명확한 단어로 치환
          $dict = [ordered]@{
            # [1. 통계 화면 및 팝업]
            '请先选择一个집안' = '먼저_가문을_선택하세요'
            '请先选择一个家族' = '먼저_가문을_선택하세요'
            '집안统计数据'     = '가문통계'
            '家族统计数据'     = '가문통계'
            '杂项统计数据'     = '기타통계'
            '各집안人数'       = '가문별인원수'
            '各家族人数'       = '가문별인원수'
            '人数'             = '인원수'
            '统计数据'         = '통계데이터'
            '杂项'             = '기타'
            '统计'             = '통계'

            # [2. 환경설정 화면 (C# 변수 속성명 - 공백 절대 금지)]
            '是否允许自动저장' = '자동저장허용'
            '是否允许自动保存' = '자동저장허용'
            '저장설정'         = '저장설정'
            '保存设置'         = '저장설정'

            '영지定义文件'     = '영지정의파일'
            '领地定义文件'     = '영지정의파일'
            '王朝定义文件'     = '왕조정의파일'
            '角色定义文件'     = '인물정의파일'
            '定义文件'         = '정의파일'

            '本地化文件'       = '현지화파일'
            '汉语翻译文件'     = '중국어번역파일'
            '英语翻译文件'     = '영어번역파일'

            '纹章收集설정'     = '문장수집설정'
            '纹章收集设置'     = '문장수집설정'
            '纹章图片저장路径' = '문장이미지저장경로'
            '纹章图片保存路径' = '문장이미지저장경로'
            '纹章定义文件路径' = '문장정의파일경로'
            '纹章收集软件启动路径' = '문장수집프로그램경로'

            '调试설정'         = '디버그설정'
            '调试设置'         = '디버그설정'
            '是否显示调试信息' = '디버그정보표시'

            '随机설정'         = '무작위설정'
            '随机设置'         = '무작위설정'
            '是否开启随机나이' = '무작위나이적용'
            '是否开启随机年龄' = '무작위나이적용'

            # [3. 기타 탭 및 부가 기능]
            '时间轴'           = '타임라인'
            '世系图'           = '가계도'
            '数据库'           = '데이터베이스'
            '连接'             = '연결'
            '断开'             = '연결해제'
            '配置'             = '환경설정'
            '作者:Fred'        = '제작: Fred'
          }

          $files = Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Extension -match '\.(xaml|cs)$' }
          foreach ($file in $files) {
            $content = [System.IO.File]::ReadAllText($file.FullName, [System.Text.Encoding]::UTF8)
            $changed = $false
            foreach ($k in $dict.Keys) {
              if ($content.Contains($k)) {
                $content = $content.Replace($k, $dict[$k])
                $changed = $true
              }
            }
            if ($changed) {
              [System.IO.File]::WriteAllText($file.FullName, $content, [System.Text.Encoding]::UTF8)
            }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore CK3ModStudio.sln

      - name: Build Solution
        run: msbuild CK3ModStudio.sln /p:Configuration=Release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CK3ModStudio-Korean-Fixed
          path: |
            **/bin/Release/
            **/bin/x64/Release/
