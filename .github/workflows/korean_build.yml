            '各文化人数'               = '문화별인원수'
            '各宗教人数'               = '종교별인원수'
            '性别比例'                 = '성별비율'
            '各家族人数'               = '가문별인원수'
            '各집안人数'               = '가문별인원수'

            # [2. 캡처 속 잔여 중국어 및 유효성 검사 메시지]
