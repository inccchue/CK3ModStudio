name: Build CK3ModStudio Safe Korean

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Safely Translate All UI, Tooltips, Menus and Dialogs
        shell: pwsh
        run: |
          $utf8WithBom = New-Object System.Text.UTF8Encoding($true)

          # 원본 중국어 -> 한국어 정밀 매핑 사전
          $dict = [ordered]@{
            # [1. 통계 식별자 (C# CS1003 컴파일 에러 방지 - 띄어쓰기 금지)]
            '各家族平均寿命'           = '가문별평균수명'
            '各文化人数'               = '문화별인원수'
            '各宗教人数'               = '종교별인원수'
            '性别比例'                 = '성별비율'
            '各家族人数'               = '가문별인원수'

            # [2. 상단 메뉴 및 드롭다운 하위 항목]
            '生成'                     = '코드 생성'
            '输出'                     = '내보내기'
            '编辑'                     = '편집'
            '个人内容'                 = '인물 내용'
            '家族内容'                 = '가문 내용'
            '整个内容'                 = '전체 내용'

            # [3. 상단 툴팁(말풍선)]
            '转换到纹章收集软件'       = '문장 수집 프로그램으로 전환'
            '显示数据库'               = '데이터베이스 화면으로 전환'
            '显示统计数据'             = '통계 화면으로 전환'
            '显示领地定义'             = '영지 작위 화면으로 전환'
            '显示时间轴'               = '타임라인 화면으로 전환'
            '保存所有文件内容'         = '모든 파일 내용 저장'
            '转换到文件设置界面'       = '파일 설정 화면으로 전환'
            '转换到世系图界面'         = '가문/인물 편집 화면으로 전환'
            '转换到数据库界面'         = '데이터베이스 화면으로 전환'
            '转换到统计界面'           = '통계 화면으로 전환'
            '转换到领地定义界面'       = '영지 작위 화면으로 전환'
            '转换到时间轴界面'         = '타임라인 화면으로 전환'

            # [4. 좌측 우클릭 컨텍스트 메뉴]
            '添加家族'                 = '가문 추가'
            '添加人物'                 = '인물 추가'
            '删除家族'                 = '가문 삭제'
            '删除人物'                 = '인물 삭제'

            # [5. 가문/인물 편집 메인 화면 (좌측 속성창 및 탭)]
            '作者:Fred'                = '제작: Fred'
            '属性设置'                 = '속성 설정'
            '实时个人内容'             = '실시간 인물 내용'
            '实时文件内容'             = '실시간 파일 내용'
            '实时纹章内容'             = '실시간 문장 내용'
            '姓名'                     = '성명'
            '文化'                     = '문화'
            '宗教'                     = '종교'
            '父亲'                     = '아버지'
            '母亲'                     = '어머니'
            '配偶'                     = '배우자'
            '搜索人物...'              = '인물 검색...'
            '选中人物的事件列表'       = '선택된 인물의 이벤트 목록'
            '额外信息'                 = '추가 정보'
            '增加事件'                 = '이벤트 추가'
            '删除当前选中事件'         = '현재 선택된 이벤트 삭제'

            # [6. 작위(영지) 편집 화면]
            '打开'                     = '열기'
            '保存'                     = '저장'
            '另存为'                   = '다른 이름으로 저장'
            '搜索法理...'              = '작위 검색...'
            '移动'                     = '이동'
            '+ 帝国'                   = '+ 제국'
            '+ 王国'                   = '+ 왕국'
            '+ 公国'                   = '+ 공작령'
            '+ 伯国'                   = '+ 백작령'
            '点击左侧法理查看详情'     = '좌측 작위를 클릭해 상세정보 보기'

            # [7. 통계 및 기타 공통 메뉴]
            '家族统计数据'             = '가문 통계 데이터'
            '杂项统计数据'             = '기타 통계 데이터'
            '人数'                     = '인원수'
            '时间轴'                   = '타임라인'
            '世系图'                   = '가계도'
            '数据库'                   = '데이터베이스'
            '连接'                     = '연결'
            '断开'                     = '연결해제'
            '配置'                     = '환경설정'
            '特质'                     = '특성'
            '能力'                     = '능력치'
            '外交'                     = '외교'
            '军事'                     = '무력'
            '管理'                     = '관리'
            '谋略'                     = '지략'
            '学识'                     = '학습'
            '勇武'                     = '기량'
            '确定'                     = '확인'
            '取消'                     = '취소'

            # [8. 환경설정(FileReadWrite) 및 팝업창]
            '随机名字/姓氏文件路径'      = '무작위 이름/성씨 파일 경로'
            '是否允许自动保存'          = '자동 저장 허용 여부'
            '领地定义文件'              = '영지 정의 파일'
            '王朝定义文件'              = '왕조 정의 파일'
            '角色定义文件'              = '캐릭터 정의 파일'
            '汉语翻译文件'              = '중국어 번역 파일'
            '英语翻译文件'              = '영어 번역 파일'
            '纹章图片保存路径'          = '문장 이미지 저장 경로'
            '纹章定义文件路径'          = '문장 정의 파일 경로'
            '纹章收集软件启动路径'      = '문장 수집 프로그램 실행 경로'
            '是否显示调试信息'          = '디버그 정보 표시 여부'
            '是否开启随机年龄'          = '무작위 나이 사용 여부'
            '保存设置'                  = '저장 설정'
            '定义文件'                  = '정의 파일'
            '本地化文件'                = '로컬라이제이션 파일'
            '纹章收集设置'              = '문장 수집 설정'
            '调试设置'                  = '디버그 설정'
            '随机设置'                  = '무작위 설정'
            '中文家族名'                = '한글가문명'
            '英文家族名'                = '영문가문명'
            '属性设置窗口'              = '가문 속성 설정'

            # [9. 시스템 알림(Toast) 및 상태바]
            '请先选择一个家族'          = '먼저 가문을 선택하세요'
            '解析名称文件失败，请检查文件格式或路径是否正确。' = '이름 파일 파싱 실패. 게임 설치 경로를 확인하세요.'
            '就绪'                      = '준비 완료'
            '错误'                      = '오류'
            '提示'                      = '알림'
          }

          # 긴 문자열부터 우선 치환 (단어 쪼개짐 원천 차단)
          $sortedKeys = $dict.Keys | Sort-Object -Property Length -Descending

          $targetFiles = Get-ChildItem -Path "CK3ModStudio" -Recurse -File | Where-Object { $_.Extension -match '\.(xaml|cs|resx)$' }

          foreach ($file in $targetFiles) {
            $content = [System.IO.File]::ReadAllText($file.FullName, [System.Text.Encoding]::UTF8)
            $changed = $false

            foreach ($k in $sortedKeys) {
              if ($content.Contains($k)) {
                $content = $content.Replace($k, $dict[$k])
                $changed = $true
              }
            }

            # XAML Name 식별자 내 공백 자동 제거 (MC3010 컴파일 에러 차단)
            if ($file.Extension -eq '.xaml') {
              $content = [System.Text.RegularExpressions.Regex]::Replace($content, '(?<=(?:x:)?Name=")[^"]+', {
                param($m)
                return $m.Value.Replace(' ', '_')
              })
            }

            if ($changed) {
              [System.IO.File]::WriteAllText($file.FullName, $content, $utf8WithBom)
            }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore CK3ModStudio.sln

      - name: Build Solution
        run: msbuild CK3ModStudio.sln /p:Configuration=Release /v:minimal

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CK3ModStudio-Korean-Fixed
          path: |
            **/bin/Release/
            **/bin/x64/Release/
