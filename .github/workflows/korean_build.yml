name: Build CK3ModStudio Safe Korean

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Safely Translate UI, Tooltips and Dialogs
        shell: pwsh
        run: |
          $utf8WithBom = New-Object System.Text.UTF8Encoding($true)

          # 1. 화면 UI (.xaml) - 메뉴, 툴팁, 탭 이름 정밀 치환
          $xamlDict = [ordered]@{
            # [우클릭 메뉴 및 버튼 잔여물]
            '添加가문'                = '가문 추가'
            '添加家族'                = '가문 추가'
            '添加人物'                = '인물 추가'
            '删除가문'                = '가문 삭제'
            '删除家族'                = '가문 삭제'
            '删除人物'                = '인물 삭제'

            # [상단 탭 이름]
            '实时파일내용'            = '실시간 파일 내용'
            '实时文件内容'            = '실시간 파일 내용'
            '实时个人内容'            = '실시간 인물 내용'
            '实时纹章内容'            = '실시간 문장 내용'

            # [상단 아이콘 툴팁(말풍선)]
            '저장所有파일내용'        = '모든 파일 내용 저장'
            '保存所有文件内容'        = '모든 파일 내용 저장'
            '转换到파일설정界面'      = '파일 설정 화면으로 전환'
            '转换到文件设置界面'      = '파일 설정 화면으로 전환'
            '转换到世系图界面'        = '가문/인물 편집 화면으로 전환'
            '转换到数据库界面'        = '데이터베이스 화면으로 전환'
            '转换到统计界面'          = '통계 화면으로 전환'
            '转换到领地定义界面'      = '영지 작위 화면으로 전환'
            '转换到영지정의界面'      = '영지 작위 화면으로 전환'
            '转换到时间轴界面'        = '타임라인 화면으로 전환'

            # [팝업 창 타이틀]
            '属性设置窗口'            = '속성 설정 창'

            # [기본 공통 UI]
            '作者:Fred'               = '제작: Fred'
            '生成'                    = '코드 생성'
            '输出'                    = '내보내기'
            '编辑'                    = '편집'
            '属性设置'                = '속성 설정'
            '姓名'                    = '성명'
            '文化'                    = '문화'
            '宗教'                    = '종교'
            '父亲'                    = '아버지'
            '母亲'                    = '어머니'
            '配偶'                    = '배우자'
            '搜索人物...'             = '인물 검색...'
            '选中人物的事件列表'      = '선택된 인물의 이벤트 목록'
            '额外信息'                = '추가 정보'
            '增加事件'                = '이벤트 추가'
            '删除当前选中事件'        = '현재 선택된 이벤트 삭제'
            '打开'                    = '열기'
            '保存'                    = '저장'
            '另存为'                  = '다른 이름으로 저장'
            '搜索法理...'             = '작위 검색...'
            '移动'                    = '이동'
            '+ 帝国'                  = '+ 제국'
            '+ 王国'                  = '+ 왕국'
            '+ 公国'                  = '+ 공작령'
            '+ 伯国'                  = '+ 백작령'
            '点击左侧法理查看详情'    = '좌측 작위를 클릭해 상세정보 보기'
            '家族统计数据'            = '가문 통계 데이터'
            '杂项统计数据'            = '기타 통계 데이터'
            '各家族人数'              = '가문별 인원수'
            '人数'                    = '인원수'
            '时间轴'                  = '타임라인'
            '世系图'                  = '가계도'
            '数据库'                  = '데이터베이스'
            '连接'                    = '연결'
            '断开'                    = '연결해제'
            '配置'                    = '환경설정'
            '特质'                    = '특성'
            '能力'                    = '능력치'
            '外交'                    = '외교'
            '军事'                    = '무력'
            '管理'                    = '관리'
            '谋略'                    = '지략'
            '학식'                    = '학습'
            '勇武'                    = '기량'
            '就绪'                    = '준비 완료'
            '确定'                    = '확인'
            '取消'                    = '취소'
          }

          Get-ChildItem -Path "CK3ModStudio" -Recurse -Filter "*.xaml" | ForEach-Object {
            $content = [System.IO.File]::ReadAllText($_.FullName, [System.Text.Encoding]::UTF8)
            $modified = $false
            foreach ($k in $xamlDict.Keys) {
              if ($content.Contains($k)) {
                $content = $content.Replace($k, $xamlDict[$k])
                $modified = $true
              }
            }
            if ($modified) {
              [System.IO.File]::WriteAllText($_.FullName, $content, $utf8WithBom)
            }
          }

          # 2. C# 소스 코드 (.cs) - 창 제목 및 속성 그리드 명칭 치환 (문법 오류 방지용 공백 제거 단어 사용)
          $csDict = [ordered]@{
            '"属性设置窗口"'                                       = '"가문 속성 설정"'
            '"请先选择一个家族"'                                   = '"먼저 가문을 선택하세요"'
            '"解析名称文件失败，请检查文件格式或路径是否正确。"'   = '"이름 파일 파싱 실패. 게임 설치 경로를 확인하세요."'
            '"错误"'                                               = '"오류"'
            '"提示"'                                               = '"알림"'

            # 가문 생성 대화창 속성 라벨 치환
            '中文가문名'                                           = '한글가문명'
            '中文家族名'                                           = '한글가문명'
            '英文가문名'                                           = '영문가문명'
            '英文家族名'                                           = '영문가문명'

            # 환경설정 항목 라벨
            'DisplayName("是否允许自动保存")'                      = 'DisplayName("자동 저장 허용 여부")'
            'DisplayName("领地定义文件")'                          = 'DisplayName("영지 정의 파일")'
            'DisplayName("王朝定义文件")'                          = 'DisplayName("왕조 정의 파일")'
            'DisplayName("角色定义文件")'                          = 'DisplayName("캐릭터 정의 파일")'
            'DisplayName("汉语翻译文件")'                          = 'DisplayName("중국어 번역 파일")'
            'DisplayName("英语翻译文件")'                          = 'DisplayName("영어 번역 파일")'
            'DisplayName("纹章图片保存路径")'                      = 'DisplayName("문장 이미지 저장 경로")'
            'DisplayName("纹章定义文件路径")'                      = 'DisplayName("문장 정의 파일 경로")'
            'DisplayName("纹章收集软件启动路径")'                  = 'DisplayName("문장 수집 프로그램 실행 경로")'
            'DisplayName("是否显示调试信息")'                      = 'DisplayName("디버그 정보 표시 여부")'
            'DisplayName("是否开启随机年龄")'                      = 'DisplayName("무작위 나이 사용 여부")'
            'Category("保存设置")'                                 = 'Category("저장 설정")'
            'Category("定义文件")'                                 = 'Category("정의 파일")'
            'Category("本地化文件")'                               = 'Category("로컬라이제이션 파일")'
            'Category("纹章收集设置")'                             = 'Category("문장 수집 설정")'
            'Category("调试设置")'                                 = 'Category("디버그 설정")'
            'Category("随机设置")'                                 = 'Category("무작위 설정")'
          }

          Get-ChildItem -Path "CK3ModStudio" -Recurse -Filter "*.cs" | ForEach-Object {
            $content = [System.IO.File]::ReadAllText($_.FullName, [System.Text.Encoding]::UTF8)
            $modified = $false
            foreach ($k in $csDict.Keys) {
              if ($content.Contains($k)) {
                $content = $content.Replace($k, $csDict[$k])
                $modified = $true
              }
            }
            if ($modified) {
              [System.IO.File]::WriteAllText($_.FullName, $content, $utf8WithBom)
            }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore CK3ModStudio.sln

      - name: Build Solution
        run: msbuild CK3ModStudio.sln /p:Configuration=Release /v:minimal

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CK3ModStudio-Korean-Fixed
          path: |
            **/bin/Release/
            **/bin/x64/Release/
