            '目标领地不能与原领地相同' = '대상 작위는 원래 작위와 같을 수 없습니다'
            '请选择目标领地'           = '대상 작위를 선택하세요'
            '就绪'                     = '준비 완료'

            # [3. 결합형 알림 메시지 완전 치환]
