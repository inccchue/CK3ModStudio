            '性别'                     = '성별'
            '男性'                     = '남성'
            '女性'                     = '여성'
            '宗教名'                   = '종교명'
            '文化名'                   = '문화명'
            '中文家族名'               = '한글가문명'
            '中文가문名'               = '한글가문명'
            '英文家族名'               = '영문가문명'
            '英文가문名'               = '영문가문명'
