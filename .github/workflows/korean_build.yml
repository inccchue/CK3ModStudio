            '文化名'                   = '문화명'
            '中文家族名'               = '한글가문명'
            '中文가문名'               = '한글가문명'
            '英文家族名'               = '영문가문명'
            '英文가문名'               = '영문가문명'
            '属性设置窗口'             = '속성 설정 창'
            '个人信息'                 = '개인 정보'
            '基本信息'                 = '기본 정보'
            '性别'                     = '성별'
            '男性'                     = '남성'
            '女性'                     = '여성'

            # [창 제목, 툴팁, 상단 메뉴]
            '작者:Fred'                = '제작: Fred'
            '作者:Fred'                = '제작: Fred'
            '法理编辑器'               = '영지 작위 에디터'
            '转换到纹章收集软件'       = '문장 수집 프로그램으로 전환'
            '显示数据库'               = '데이터베이스 화면으로 전환'
            '显示统计数据'             = '통계 화면으로 전환'
            '显示领地定义'             = '영지 작위 화면으로 전환'
            '显示时间轴'               = '타임라인 화면으로 전환'
            '保存所有文件内容'         = '모든 파일 내용 저장'
            '저장所有파일내용'         = '모든 파일 내용 저장'
            '转换到文件设置界面'       = '파일 설정 화면으로 전환'
            '转换到파일설정界面'       = '파일 설정 화면으로 전환'
            '转换到世系图界面'         = '가문/인물 편집 화면으로 전환'
            '转换到数据库界面'         = '데이터베이스 화면으로 전환'
            '转换到统计界面'           = '통계 화면으로 전환'
            '转换到领地定义界面'       = '영지 작위 화면으로 전환'
            '转换到영지정의界面'       = '영지 작위 화면으로 전환'
            '转换到时间轴界面'         = '타임라인 화면으로 전환'

            # [메뉴 드롭다운]
            '코드 생성个人内容'        = '인물 코드 생성'
            '코드 생성家族内容'        = '가문 코드 생성'
            '코드 생성整个内容'        = '전체 코드 생성'
            '내보내기个人内容'         = '인물 코드 내보내기'
            '내보내기家族内容'         = '가문 코드 내보내기'
            '내보내기整个内容'         = '전체 코드 내보내기'
            '生成个人内容'             = '인물 코드 생성'
            '生成家族内容'             = '가문 코드 생성'
            '生成整个内容'             = '전체 코드 생성'
            '输出个人内容'             = '인물 코드 내보내기'
            '输出家族内容'             = '가문 코드 내보내기'
            '输出整个内容'             = '전체 코드 내보내기'
            '个人内容'                 = '인물 내용'
            '家族内容'                 = '가문 내용'
            '整个内容'                 = '전체 내용'

            # [우클릭 메뉴]
            '添加家族'                 = '가문 추가'
            '添加가문'                 = '가문 추가'
            '添加人物'                 = '인물 추가'
            '添加宗教'                 = '종교 추가'
            '添加文化'                 = '문화 추가'
            '删除家族'                 = '가문 삭제'
            '删除가문'                 = '가문 삭제'
            '删除人物'                 = '인물 삭제'

            # [메인 화면 및 공통 속성]
            '属性设置'                 = '속성 설정'
            '实时个人内容'             = '실시간 인물 내용'
            '实时文件内容'             = '실시간 파일 내용'
            '实时纹章内容'             = '실시간 문장 내용'
            '姓名'                     = '성명'
            '文化'                     = '문화'
            '宗教'                     = '종교'
            '父亲'                     = '아버지'
            '母亲'                     = '어머니'
            '配偶'                     = '배우자'
            '배우자'                   = '배우자'
            '搜索人物...'              = '인물 검색...'
            '选中人物的事件列表'       = '선택된 인물의 이벤트 목록'
            '额外信息'                 = '추가 정보'
            '增加事件'                 = '이벤트 추가'
            '删除当前选中事件'         = '현재 선택된 이벤트 삭제'
            '家族'                     = '가문'
            '家族统计数据'             = '가문 통계 데이터'
            '杂项统计数据'             = '기타 통계 데이터'
            '人数'                     = '인원수'
            '时间轴'                   = '타임라인'
            '世系图'                   = '가계도'
            '数据库'                   = '데이터베이스'
            '连接'                     = '연결'
            '断开'                     = '연결해제'
            '配置'                     = '환경설정'
            '特质'                     = '특성'
            '能力'                     = '능력치'
            '外交'                     = '외교'
            '军事'                     = '무력'
            '管理'                     = '관리'
            '谋略'                     = '지략'
            '学识'                     = '학습'
            '勇武'                     = '기량'
            '确定'                     = '확인'
            '取消'                     = '취소'
            '生成'                     = '코드 생성'
            '输出'                     = '내보내기'
            '编辑'                     = '편집'
            '错误'                     = '오류'
            '提示'                     = '알림'
          }

          $sortedKeys = $dict.Keys | Sort-Object -Property Length -Descending
          $targetFiles = Get-ChildItem -Path "CK3ModStudio" -Recurse -File | Where-Object { $_.Extension -match '\.(xaml|cs|resx)$' }

          foreach ($file in $targetFiles) {
            $content = [System.IO.File]::ReadAllText($file.FullName, [System.Text.Encoding]::UTF8)
            $content = $content.TrimStart([char]0xFEFF)
            $changed = $false

            # 혼합형 알림 메시지 정규식 전수 치환
            $regexPatterns = @(
              '请[^\"]*?(?:선택|选择)[^\"]*?(?:가문|家族)[^\"]*',
              '请先선택[^\"]*?가문',
              '请先选择[^\"]*?家族',
              '请先선택[^\"]*',
              '请先选择[^\"]*'
            )
            foreach ($pat in $regexPatterns) {
              if ($content -match $pat) {
                $content = [System.Text.RegularExpressions.Regex]::Replace($content, $pat, '먼저 가문을 선택하세요')
                $changed = $true
              }
            }

            foreach ($k in $sortedKeys) {
              if ($content.Contains($k)) {
                $content = $content.Replace($k, $dict[$k])
                $changed = $true
              }
            }

            # XAML Name 식별자 내 공백 제거 (MC3010 방지)
            if ($file.Extension -eq '.xaml') {
              $newContent = [System.Text.RegularExpressions.Regex]::Replace($content, '(?<=(?:x:)?Name=")[^"]+', {
                param($m)
                return $m.Value.Replace(' ', '_')
              })
              if ($newContent -ne $content) {
                $content = $newContent
                $changed = $true
              }
            }

            if ($changed) {
              [System.IO.File]::WriteAllText($file.FullName, $content, $utf8WithBom)
            }
          }

      - name: Audit Remaining Chinese Characters (Excluding Comments)
        shell: pwsh
        run: |
          Write-Host "=== 빌드 전 소스 코드 내 잔여 중국어(주석 제외) 검사 시작 ==="
          $chineseRegex = '[\u4e00-\u9fa5]'
          $remaining = @()

          Get-ChildItem -Path "CK3ModStudio" -Recurse -File | Where-Object { $_.Extension -match '\.(xaml|cs)$' } | ForEach-Object {
            $lines = [System.IO.File]::ReadAllLines($_.FullName, [System.Text.Encoding]::UTF8)
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $raw = $lines[$i].Trim()
              # 순수 주석 라인 및 C# #region 지시어 제외
              if ($raw.StartsWith('//') -or $raw.StartsWith('#region') -or $raw.StartsWith('#endregion') -or $raw.StartsWith('/*') -or $raw.StartsWith('*')) {
                continue
              }
              # 코드 뒷부분 인라인 주석(// ...) 제거 후 실제 실행 코드만 추출
              $codeOnly = ($raw -replace '//.*$', '').Trim()
              if ($codeOnly -match $chineseRegex) {
                $remaining += "$($_.Name):L$($i+1) -> $codeOnly"
              }
            }
          }

          if ($remaining.Count -gt 0) {
            Write-Host "::warning::실제 실행 코드 내 잔여 중국어 $($remaining.Count)건 발견:"
            $remaining | Select-Object -First 30 | ForEach-Object { Write-Host "  [미번역] $_" }
          } else {
            Write-Host "=== 모든 실행 코드와 UI에서 중국어가 100% 제거되었습니다! ==="
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore CK3ModStudio.sln

      - name: Build Solution
        run: msbuild CK3ModStudio.sln /p:Configuration=Release /v:minimal

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CK3ModStudio-Korean-Fixed
          path: |
            **/bin/Release/
            **/bin/x64/Release/
