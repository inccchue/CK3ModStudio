            '解析名称文件失败，请检查文件格式或路径是否正确。' = '이름 파일 파싱에 실패했습니다. 게임 설치 경로 또는 파일 형식을 확인하세요.'
            '请先选择一个家族' = '먼저 가문을 선택하세요'
            '错误' = '오류'
            '成功' = '성공'
          }

          # x:Name / Name 속성은 절대 건드리지 않음 (식별자라 공백/특수문자 불가)
          # Content=, Header=, Text=, ToolTip=, Title=, GroupName= 같은
          # "화면 표시용" 속성값과, 태그 사이의 텍스트(> 문구 <)만 번역 대상으로 삼는다.
          $attrPattern = '(?<=(?:Content|Header|Text|ToolTip|Title|GroupName|Watermark)=")([^"]*)(?=")'
          $tagTextPattern = '(?<=>)([^<>]*[\u4e00-\u9fff][^<>]*)(?=<)'

          Get-ChildItem -Path "CK3ModStudio" -Recurse -Filter "*.xaml" | ForEach-Object {
            $content = [System.IO.File]::ReadAllText($_.FullName, [System.Text.Encoding]::UTF8)
            $original = $content

            $content = [System.Text.RegularExpressions.Regex]::Replace($content, $attrPattern, {
              param($m)
              $val = $m.Value
              foreach ($k in $dict.Keys) { $val = $val.Replace($k, $dict[$k]) }
              return $val
            })

            $content = [System.Text.RegularExpressions.Regex]::Replace($content, $tagTextPattern, {
              param($m)
              $val = $m.Value
              foreach ($k in $dict.Keys) { $val = $val.Replace($k, $dict[$k]) }
              return $val
            })

            if ($content -ne $original) {
              [System.IO.File]::WriteAllText($_.FullName, $content, $utf8WithBom)
            }
          }

          # C# 쪽은 MessageBox/DisplayName 등 문자열 리터럴만 한정된 사전으로 치환
          $csDict = [ordered]@{
            '"请先选择一个家族"' = '"먼저 가문을 선택하세요"'
            '"解析名称文件失败，请检查文件格式或路径是否正确。"' = '"이름 파일 파싱에 실패했습니다. 게임 설치 경로 또는 파일 형식을 확인하세요."'
            '"错误"' = '"오류"'
            '"提示"' = '"안내"'
            '"成功"' = '"성공"'
          }

          Get-ChildItem -Path "CK3ModStudio" -Recurse -Filter "*.cs" | ForEach-Object {
            $content = [System.IO.File]::ReadAllText($_.FullName, [System.Text.Encoding]::UTF8)
            $modified = $false
            foreach ($k in $csDict.Keys) {
              if ($content.Contains($k)) {
                $content = $content.Replace($k, $csDict[$k])
                $modified = $true
              }
            }
            if ($modified) {
              [System.IO.File]::WriteAllText($_.FullName, $content, $utf8WithBom)
            }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore CK3ModStudio.sln

      - name: Build Solution
        run: msbuild CK3ModStudio.sln /p:Configuration=Release /v:minimal

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CK3ModStudio-Korean-Fixed
          path: |
            **/bin/Release/
            **/bin/x64/Release/
