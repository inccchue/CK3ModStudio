name: Build CK3ModStudio Safe Korean

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Safely Translate All UI, Tooltips, Menus and Dialogs
        shell: pwsh
        run: |
          $utf8WithBom = New-Object System.Text.UTF8Encoding($true)

          # 누락 없는 전체 번역 사전
          $dict = [ordered]@{
            # [1. 통계 열거형 식별자 (CS1003 컴파일 에러 방지 - 띄어쓰기 절대 금지)]
            '各家族平均寿命'           = '가문별평균수명'
            '各文化인원수'             = '문화별인원수'
            '各文化人数'               = '문화별인원수'
            '各宗教인원수'             = '종교별인원수'
            '各宗教人数'               = '종교별인원수'
            '性别比例'                 = '성별비율'
            '各家族人数'               = '가문별인원수'
            '各집안人数'               = '가문별인원수'

            # [2. 상단 메뉴 드롭다운 (반쪽 치환 잔여물 최우선 치환)]
            '코드 생성个人内容'        = '인물 코드 생성'
            '코드 생성家族内容'        = '가문 코드 생성'
            '코드 생성整个内容'        = '전체 코드 생성'
            '내보내기个人内容'         = '인물 코드 내보내기'
            '내보내기家族内容'         = '가문 코드 내보내기'
            '내보내기整个内容'         = '전체 코드 내보내기'
            '生成个人内容'             = '인물 코드 생성'
            '生成家族内容'             = '가문 코드 생성'
            '生成整个内容'             = '전체 코드 생성'
            '输出个人内容'             = '인물 코드 내보내기'
            '输出家族内容'             = '가문 코드 내보내기'
            '输出整个内容'             = '전체 코드 내보내기'
            '个人内容'                 = '인물 내용'
            '家族内容'                 = '가문 내용'
            '整个内容'                 = '전체 내용'

            # [3. 상단 툴팁(말풍선) 및 상태표시]
            '转换到纹章收集软件'       = '문장 수집 프로그램으로 전환'
            '显示데이터베이스'         = '데이터베이스 화면으로 전환'
            '显示数据库'               = '데이터베이스 화면으로 전환'
            '显示统计数据'             = '통계 화면으로 전환'
            '저장所有파일내용'         = '모든 파일 내용 저장'
            '保存所有文件内容'         = '모든 파일 내용 저장'
            '转换到파일설정界面'       = '파일 설정 화면으로 전환'
            '转换到文件设置界面'       = '파일 설정 화면으로 전환'
            '转换到世系图界面'         = '가문/인물 편집 화면으로 전환'
            '转换到数据库界面'         = '데이터베이스 화면으로 전환'
            '转换到统计界面'           = '통계 화면으로 전환'
            '转换到영지정의界面'       = '영지 작위 화면으로 전환'
            '转换到领地定义界面'       = '영지 작위 화면으로 전환'
            '转换到时间轴界面'         = '타임라인 화면으로 전환'

            # [4. 좌측 우클릭 컨텍스트 메뉴]
            '添加家族'                 = '가문 추가'
            '添加가문'                 = '가문 추가'
            '添加人物'                 = '인물 추가'
            '删除家族'                 = '가문 삭제'
            '删除가문'                 = '가문 삭제'
            '删除人物'                 = '인물 삭제'

            # [5. 시스템 알림(Toast) 및 환경설정 파일 경로]
            '请先选择一个家族'         = '먼저 가문을 선택하세요'
            '解析名称文件失败，请检查文件格式或路径是否正确。' = '이름 파일 파싱 실패. 게임 설치 경로를 확인하세요.'
            '随机名字/姓氏文件路径'     = '무작위 이름/성씨 파일 경로'
            '中文가문名'               = '한글가문명'
            '中文家族名'               = '한글가문명'
            '英文가문名'               = '영문가문명'
            '英文家族名'               = '영문가문명'
            '属性设置窗口'             = '가문 속성 설정'
            '就绪'                     = '준비 완료'
            '错误'                     = '오류'
            '提示'                     = '알림'

            # [6. 기본 UI 텍스트]
            '家族统计数据'             = '가문 통계 데이터'
            '杂项统计数据'             = '기타 통계 데이터'
            '作者:Fred'                = '제작: Fred'
            '实时파일내용'             = '실시간 파일 내용'
            '实时文件内容'             = '실시간 파일 내용'
            '实时个人内容'             = '실시간 인물 내용'
            '实时纹章内容'             = '실시간 문장 내용'
            '속성 설정'                = '속성 설정'
            '성명'                     = '성명'
            '문화'                     = '문화'
            '종교'                     = '종교'
            '아버지'                   = '아버지'
            '어머니'                   = '어머니'
            '배우자'                   = '배우자'
            '인물 검색...'             = '인물 검색...'
            '선택된 인물의 이벤트 목록'= '선택된 인물의 이벤트 목록'
            '추가 정보'                = '추가 정보'
            '이벤트 추가'              = '이벤트 추가'
            '현재 선택된 이벤트 삭제'  = '현재 선택된 이벤트 삭제'
            '열기'                     = '열기'
            '저장'                     = '저장'
            '다른 이름으로 저장'       = '다른 이름으로 저장'
            '작위 검색...'             = '작위 검색...'
            '이동'                     = '이동'
            '+ 제국'                   = '+ 제국'
            '+ 왕국'                   = '+ 왕국'
            '+ 공작령'                 = '+ 공작령'
            '+ 백작령'                 = '+ 백작령'
            '좌측 작위를 클릭해 상세정보 보기' = '좌측 작위를 클릭해 상세정보 보기'
            '타임라인'                 = '타임라인'
            '가계도'                   = '가계도'
            '데이터베이스'             = '데이터베이스'
            '연결'                     = '연결'
            '연결해제'                 = '연결해제'
            '환경설정'                 = '환경설정'
            '특성'                     = '특성'
            '능력치'                   = '능력치'
            '외교'                     = '외교'
            '무력'                     = '무력'
            '관리'                     = '관리'
            '지략'                     = '지략'
            '학습'                     = '학습'
            '기량'                     = '기량'
            '확인'                     = '확인'
            '취소'                     = '취소'
            '인원수'                   = '인원수'
            '생성'                     = '코드 생성'
            '출력'                     = '내보내기'
            '편집'                     = '편집'
          }

          # 긴 문자열부터 우선 치환
          $sortedKeys = $dict.Keys | Sort-Object -Property Length -Descending

          $targetFiles = Get-ChildItem -Path "CK3ModStudio" -Recurse -File | Where-Object { $_.Extension -match '\.(xaml|cs|resx)$' }

          foreach ($file in $targetFiles) {
            $content = [System.IO.File]::ReadAllText($file.FullName, [System.Text.Encoding]::UTF8)
            $changed = $false

            foreach ($k in $sortedKeys) {
              if ($content.Contains($k)) {
                $content = $content.Replace($k, $dict[$k])
                $changed = $true
              }
            }

            # XAML Name 식별자 내 공백 자동 제거 (MC3010 방지)
            if ($file.Extension -eq '.xaml') {
              $content = [System.Text.RegularExpressions.Regex]::Replace($content, '(?<=(?:x:)?Name=")[^"]+', {
                param($m)
                return $m.Value.Replace(' ', '_')
              })
            }

            if ($changed) {
              [System.IO.File]::WriteAllText($file.FullName, $content, $utf8WithBom)
            }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore CK3ModStudio.sln

      - name: Build Solution
        run: msbuild CK3ModStudio.sln /p:Configuration=Release /v:minimal

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CK3ModStudio-Korean-Fixed
          path: |
            **/bin/Release/
            **/bin/x64/Release/
