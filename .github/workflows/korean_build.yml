            '코드 생성家族内容'        = '가문 코드 생성'
            '코드 생성整个内容'        = '전체 코드 생성'
            '내보내기个人内容'         = '인물 코드 내보내기'
            '내보내기家族内容'         = '가문 코드 내보내기'
            '내보내기整个内容'         = '전체 코드 내보내기'
            '生成个人内容'             = '인물 코드 생성'
            '生成家族内容'             = '가문 코드 생성'
            '生成整个内容'             = '전체 코드 생성'
            '输出个人内容'             = '인물 코드 내보내기'
            '输出家族内容'             = '가문 코드 내보내기'
            '输出整个内容'             = '전체 코드 내보내기'
            '个人内容'                 = '인물 내용'
            '家族内容'                 = '가문 내용'
            '整个内容'                 = '전체 내용'

            # [7. 우클릭 메뉴]
            '添加家族'                 = '가문 추가'
            '添加가문'                 = '가문 추가'
            '添加人物'                 = '인물 추가'
            '添加宗教'                 = '종교 추가'
            '添加文化'                 = '문화 추가'
            '删除家族'                 = '가문 삭제'
            '删除가문'                 = '가문 삭제'
            '删除人物'                 = '인물 삭제'

            # [8. 메인 속성창 및 작위 화면]
            '属性设置'                 = '속성 설정'
            '实时个人内容'             = '실시간 인물 내용'
            '实时文件内容'             = '실시간 파일 내용'
            '实时纹章内容'             = '실시간 문장 내용'
            '姓名'                     = '성명'
            '文化'                     = '문화'
            '宗教'                     = '종교'
            '父亲'                     = '아버지'
            '母亲'                     = '어머니'
            '배우자'                   = '배우자'
            '配偶'                     = '배우자'
            '搜索人物...'              = '인물 검색...'
            '选中人物的事件列表'       = '선택된 인물의 이벤트 목록'
            '额外信息'                 = '추가 정보'
            '增加事件'                 = '이벤트 추가'
            '删除当前选中事件'         = '현재 선택된 이벤트 삭제'
            '打开'                     = '열기'
            '保存'                     = '저장'
            '另存为'                   = '다른 이름으로 저장'
            '搜索法理...'              = '작위 검색...'
            '移动'                     = '이동'
            '+ 帝国'                   = '+ 제국'
            '+ 王国'                   = '+ 왕국'
            '+ 公国'                   = '+ 공작령'
            '+ 伯国'                   = '+ 백작령'
            '点击左侧法理查看详情'     = '좌측 작위를 클릭해 상세정보 보기'

            # [9. 하위 다이얼로그 및 환경설정]
            '模组名称'                 = '모드 이름'
            '模组路径'                 = '모드 경로'
            '模组版本'                 = '모드 버전'
            '生成模组'                 = '모드 생성'
            '支持的游戏版本'           = '지원 게임 버전'
            '移动领地'                 = '작위 이동'
            '移动到'                   = '다음 위치로 이동'
            '原领地'                   = '원래 작위'
            '目标领地'                 = '대상 작위'
            '数据库类型'               = '데이터베이스 유형'
            '服务器地址'               = '서버 주소'
            '端口'                     = '포트'
            '用户名'                   = '사용자 이름'
            '密码'                     = '비밀번호'
            '数据库名称'               = '데이터베이스 이름'
            '测试连接'                 = '연결 테스트'
            '连接成功'                 = '연결 성공'
            '连接失败'                 = '연결 실패'
            '随机名字/姓氏文件路径'     = '무작위 이름/성씨 파일 경로'
            '是否允许自动保存'         = '자동 저장 허용 여부'
            '领地定义文件'             = '영지 정의 파일'
            '王朝定义文件'             = '왕조 정의 파일'
            '角色定义文件'             = '캐릭터 정의 파일'
            '汉语翻译文件'             = '중국어 번역 파일'
            '英语翻译文件'             = '영어 번역 파일'
            '纹章图片保存路径'         = '문장 이미지 저장 경로'
            '纹章定义文件路径'         = '문장 정의 파일 경로'
            '纹章收集软件启动路径'     = '문장 수집 프로그램 실행 경로'
            '是否显示调试信息'         = '디버그 정보 표시 여부'
            '是否开启随机年龄'         = '무작위 나이 사용 여부'
            '保存设置'                 = '저장 설정'
            '定义文件'                 = '정의 파일'
            '本地化文件'               = '로컬라이제이션 파일'
            '纹章收集设置'             = '문장 수집 설정'
            '调试设置'                 = '디버그 설정'
            '随机设置'                 = '무작위 설정'

            # [10. 시스템 공통 UI 및 단일 명칭]
            '家族统计数据'             = '가문 통계 데이터'
            '杂项统计数据'             = '기타 통계 데이터'
            '人数'                     = '인원수'
            '时间轴'                   = '타임라인'
            '世系图'                   = '가계도'
            '数据库'                   = '데이터베이스'
            '连接'                     = '연결'
            '断开'                     = '연결해제'
            '配置'                     = '환경설정'
            '特质'                     = '특성'
            '能力'                     = '능력치'
            '外交'                     = '외교'
            '军事'                     = '무력'
            '管理'                     = '관리'
            '谋略'                     = '지략'
            '学识'                     = '학습'
            '勇武'                     = '기량'
            '确定'                     = '확인'
            '取消'                     = '취소'
            '生成'                     = '코드 생성'
            '输出'                     = '내보내기'
            '编辑'                     = '편집'
            '家族'                     = '가문'
            '错误'                     = '오류'
            '提示'                     = '알림'
          }

          $sortedKeys = $dict.Keys | Sort-Object -Property Length -Descending
          $targetFiles = Get-ChildItem -Path "CK3ModStudio" -Recurse -File | Where-Object { $_.Extension -match '\.(xaml|cs|resx)$' }

          foreach ($file in $targetFiles) {
            # 표준 UTF-8로 자동 BOM 판별 로드
            $content = [System.IO.File]::ReadAllText($file.FullName, [System.Text.Encoding]::UTF8)
            # 중복 BOM 방지 (MC3000 에러 차단)
            $content = $content.TrimStart([char]0xFEFF)

            $changed = $false
            foreach ($k in $sortedKeys) {
              if ($content.Contains($k)) {
                $content = $content.Replace($k, $dict[$k])
                $changed = $true
              }
            }

            # XAML Name 식별자 내 공백 자동 언더바(_) 치환 (MC3010 에러 차단)
            if ($file.Extension -eq '.xaml') {
              $newContent = [System.Text.RegularExpressions.Regex]::Replace($content, '(?<=(?:x:)?Name=")[^"]+', {
                param($m)
                return $m.Value.Replace(' ', '_')
              })
              if ($newContent -ne $content) {
                $content = $newContent
                $changed = $true
              }
            }

            # 내용이 바뀐 파일만 UTF-8 with BOM으로 확정 저장
            if ($changed) {
              [System.IO.File]::WriteAllText($file.FullName, $content, $utf8WithBom)
            }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore CK3ModStudio.sln

      - name: Build Solution
        run: msbuild CK3ModStudio.sln /p:Configuration=Release /v:minimal

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CK3ModStudio-Korean-Fixed
          path: |
            **/bin/Release/
            **/bin/x64/Release/
