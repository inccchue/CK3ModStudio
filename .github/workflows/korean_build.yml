            '男爵领'                                   = '남작령'
            '男爵'                                     = '남작'
            '伯爵'                                     = '백작'
            '公爵'                                     = '공작'
            '国王'                                     = '국왕'
            '皇帝'                                     = '황제'
            '首都'                                     = '수도'
            '颜色'                                     = '색상'
            '省份'                                     = '프로빈스'
            '父级'                                     = '상위 작위'
            '子级数'                                   = '하위 작위 수'
            '法理'                                     = '데 유레'
            '父亲'                                     = '아버지'
            '母亲'                                     = '어머니'
            '配偶'                                     = '배우자'
            '姓名'                                     = '성명'
            '文化'                                     = '문화'
            '宗教'                                     = '종교'
            '家族'                                     = '가문'
            '数据库'                                   = '데이터베이스'
            '连接'                                     = '연결'
            '断开'                                     = '연결해제'
            '确定'                                     = '확인'
            '取消'                                     = '취소'
            '出生'                                     = '출생'
            '死亡'                                     = '사망'
            '结婚'                                     = '혼인'
            '性别'                                     = '성별'
            '男性'                                     = '남성'
            '女性'                                     = '여성'
            '人数'                                     = '인원수'
            '运行中'                                   = '실행 중'
            '已停止'                                   = '중지됨'
            '就绪'                                     = '준비 완료'
            '错误'                                     = '오류'
            '提示'                                     = '알림'
            '重置'                                     = '초기화'
            '刷新'                                     = '새로고침'
            '加载'                                     = '불러오기'
          }

          $sortedKeys = $dict.Keys | Sort-Object -Property Length -Descending
          $targetFiles = Get-ChildItem -Path "CK3ModStudio" -Recurse -File | Where-Object { $_.Extension -match '\.(xaml|cs|resx)$' }

          foreach ($file in $targetFiles) {
            $content = [System.IO.File]::ReadAllText($file.FullName, [System.Text.Encoding]::UTF8)
            $content = $content.TrimStart([char]0xFEFF)
            $changed = $false

            # 혼합형 알림 메시지 정규식 치환
            $regexPatterns = @(
              '请[^\"]*?(?:선택|选择)[^\"]*?(?:가문|家族)[^\"]*',
              '请先선택[^\"]*?가문',
              '请先选择[^\"]*?家族',
              '请先선택[^\"]*',
              '请先选择[^\"]*'
            )
            foreach ($pat in $regexPatterns) {
              if ($content -match $pat) {
                $content = [System.Text.RegularExpressions.Regex]::Replace($content, $pat, '먼저 가문을 선택하세요')
                $changed = $true
              }
            }

            foreach ($k in $sortedKeys) {
              if ($content.Contains($k)) {
                $content = $content.Replace($k, $dict[$k])
                $changed = $true
              }
            }

            # XAML Name 식별자 내 공백 자동 언더바(_) 치환
            if ($file.Extension -eq '.xaml') {
              $newContent = [System.Text.RegularExpressions.Regex]::Replace($content, '(?<=(?:x:)?Name=")[^"]+', {
                param($m)
                return $m.Value.Replace(' ', '_')
              })
              if ($newContent -ne $content) {
                $content = $newContent
                $changed = $true
              }
            }

            if ($changed) {
              [System.IO.File]::WriteAllText($file.FullName, $content, $utf8WithBom)
            }
          }

      - name: Audit and Report Remaining Chinese
        shell: pwsh
        run: |
          Write-Host "=== 잔여 중국어 전수 스캔 및 Summary 보고서 생성 ==="
          $chineseRegex = '[\u4e00-\u9fa5]'
          $remaining = @()

          Get-ChildItem -Path "CK3ModStudio" -Recurse -File | Where-Object { $_.Extension -match '\.(xaml|cs)$' } | ForEach-Object {
            $lines = [System.IO.File]::ReadAllLines($_.FullName, [System.Text.Encoding]::UTF8)
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $raw = $lines[$i].Trim()
              if ($raw.StartsWith('//') -or $raw.StartsWith('#region') -or $raw.StartsWith('#endregion') -or $raw.StartsWith('/*') -or $raw.StartsWith('*') -or $raw.StartsWith('<!--')) {
                continue
              }
              $codeOnly = ($raw -replace '//.*$', '' -replace '<!--.*?-->', '').Trim()
              if ($codeOnly -match $chineseRegex) {
                $remaining += "$($_.Name):L$($i+1) -> $codeOnly"
              }
            }
          }

          "### 🔍 소스 코드 내 잔여 중국어 목록 (총 $($remaining.Count)건)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ($remaining.Count -gt 0) {
            "| 파일:줄번호 | 남은 코드/문자열 |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            "| :--- | :--- |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            foreach ($item in $remaining) {
              $parts = $item -split ' -> '
              "| ``$($parts[0])`` | ``$($parts[1])`` |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
            Write-Host "::warning::잔여 중국어 $($remaining.Count)건 발견"
          } else {
            "🎉 모든 실행 코드 및 UI에서 중국어가 완전히 제거되었습니다!" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Write-Host "=== 잔여 중국어 0건 달성! ==="
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore CK3ModStudio.sln

      - name: Build Solution
        run: msbuild CK3ModStudio.sln /p:Configuration=Release /v:minimal

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CK3ModStudio-Korean-Fixed
          path: |
            **/bin/Release/
            **/bin/x64/Release/
